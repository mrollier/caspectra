# Default full-scale config (BUILD_BRIEF.md defaults): 88 rules, grid_size=127,
# BYOL + ResNet18 + GroupNorm. Switch model.method to "simsiam" if M4 memory
# forces batch < ~256. Set data.rules to null for all 88 representatives.
seed: 0
data:
  rules: null            # null -> the 88 independent equivalence-class reps
  n_ic_per_rule: 256
  grid_size: 127          # odd on purpose: a power of two collapses additive rules such as rule 90
  discard_transient: 0
  cache_dir: cache
  seed: 0
  augmentation:
    cyclic_shift: true
    coarse_grain: true
    horizontal_flip: false
    invert: false
    random_resized_crop: false
    coarse_grain_kernel: 2
    coarse_grain_prob: 0.5   # stochastic: encoder also sees fine detail (SELF_CRITICISM #4)
    crop_scale: [0.6, 1.0]
    flip_prob: 0.5
    invert_prob: 0.5
    mode: symmetric
model:
  # 'anticheat' is the recommended encoder: 2x2 first-layer kernels (cannot read a
  # rule-table entry) + a small signed bottleneck (SELF_CRITICISM.md #1). Use
  # 'resnet18' only if you specifically want the high-capacity (rule-readable) model.
  method: byol
  encoder: anticheat
  width_multiplier: 1.0
  small_input: false     # 127px -> keep the ImageNet-style stem (resnet18 only)
  norm_layer: group      # GroupNorm default (batch < 256 on M4)
  num_groups: 8
  embedding_dim: 64      # small bottleneck (anticheat/smallcnn); ignored for resnet18
  projection_hidden: 4096
  projection_out: 256
  prediction_hidden: 4096
train:
  epochs: 100
  batch_size: 128        # GroupNorm chosen because this is < 256
  lr: 0.001
  weight_decay: 0.000001
  optimizer: adamw
  tau_base: 0.996
  checkpoint_every: 10
  num_workers: 2
  output_dir: runs/default
eval:
  checkpoint: runs/default/checkpoint_final.pt
  rule_labels_csv: rule_labels.csv
  batch_size: 256
  umap_components: 10
  umap_metric: cosine
  hdbscan_min_cluster_size: 15
  hdbscan_min_samples: 5
  output_dir: runs/default/eval
